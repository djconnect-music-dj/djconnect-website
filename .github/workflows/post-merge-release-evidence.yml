name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/post-merge-release-evidence-org-487.yml@6e23f410e573343bea44bba58800ecde2059ebab
    with:
      policy_source_ref: 89a2a8b4c7571965249bed745bf7c5c37a1221f1
      required_main_workflow: Validate
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: website-cobertura-coverage
      durable_evidence_release_tag_prefix: internal-website
